name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: vitest (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Matches package.json `engines.node` (>=18): the declared floor plus the
        # current LTS lines.
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

  typecheck:
    name: tsc --noEmit (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Strictness lives in tsconfig.json; this checks src + test.
      - name: Type-check
        run: npm run typecheck

  build:
    name: build (ESM + .d.ts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The published package ships dist/, so a clean build is part of CI.
      - name: Build
        run: npm run build
